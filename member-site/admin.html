<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 | リリー</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background: #fdf5f5;
      color: #333;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      background: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f5e5e5;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 36px; height: 36px;
      background: #fdf5f5;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; color: #e95f5f;
      border: none; flex-shrink: 0;
    }
    .header h1 { font-size: 16px; font-weight: 700; }
    .admin-badge {
      background: #e95f5f;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .content { padding: 20px; max-width: 1000px; margin: 0 auto; }

    /* 会員記録フィード（一括閲覧） */
    .feed-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .feed-tab {
      background: #fdf5f5;
      border: 1.5px solid #f5c0c0;
      color: #888;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
    }
    .feed-tab.active {
      background: #e95f5f;
      border-color: #e95f5f;
      color: #fff;
    }
    .feed-panel { display: none; }
    .feed-panel.active { display: block; }
    .feed-hint {
      font-size: 12px; color: #888; line-height: 1.65; margin-bottom: 14px;
      padding: 12px 14px; background: #fdf5f5; border-radius: 12px;
      border: 1px solid #f5e5e5;
    }
    .feed-hint code { color: #c45a5a; font-size: 11px; }
    .feed-card {
      background: #fdf5f5;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid #f5e5e5;
    }
    .feed-meta {
      font-size: 11px; color: #aaa;
      margin-bottom: 8px;
      display: flex; flex-wrap: wrap; gap: 8px 14px;
    }
    .feed-meta strong { color: #666; }
    .feed-body {
      font-size: 13px; color: #444;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .feed-title { font-size: 13px; font-weight: 700; color: #e95f5f; margin-bottom: 6px; }

    /* Overview */
    .overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    @media (max-width: 600px) { .overview { grid-template-columns: repeat(2, 1fr); } }
    .ov-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 3px 14px rgba(233,95,95,0.07);
    }
    .ov-value { font-size: 30px; font-weight: 700; color: #e95f5f; }
    .ov-label { font-size: 11px; color: #bbb; margin-top: 5px; }

    /* Section */
    .section {
      background: #fff;
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px rgba(233,95,95,0.07);
    }
    .section-title { font-size: 13px; font-weight: 700; color: #bbb; margin-bottom: 18px; letter-spacing: .5px; }

    /* Goal bars */
    .goal-bars { display: flex; flex-direction: column; gap: 12px; }
    .goal-bar-row { display: flex; align-items: center; gap: 10px; }
    .goal-bar-label { font-size: 13px; width: 160px; flex-shrink: 0; color: #555; }
    .goal-bar-bg { flex: 1; background: #f5e5e5; border-radius: 4px; height: 8px; }
    .goal-bar-fill { height: 8px; border-radius: 4px; background: #e95f5f; transition: width .5s; }
    .goal-bar-count { font-size: 13px; color: #aaa; width: 24px; text-align: right; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; color: #bbb; border-bottom: 1.5px solid #f5e5e5; white-space: nowrap; font-weight: 700; font-size: 11px; letter-spacing: .5px; }
    td { padding: 13px 12px; border-bottom: 1px solid #fdf5f5; vertical-align: middle; }
    tr:hover td { background: #fdf5f5; }
    .goal-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .goal-reconnect { background: #fff0f3; color: #e95f5f; }
    .goal-next_love { background: #e8f5e9; color: #5cb87a; }
    .goal-closure { background: #e8eaf6; color: #7986cb; }
    .no-data { color: #ccc; font-style: italic; }
    .detail-btn {
      background: #fdf5f5;
      border: 1.5px solid #f5c0c0;
      color: #e95f5f;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 700;
    }
    .detail-btn:hover { background: #fff0f3; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 28px 28px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 8px 0 40px;
    }
    .modal-handle { width: 36px; height: 4px; background: #eee; border-radius: 2px; margin: 12px auto 16px; }
    .modal-header { padding: 0 20px 16px; border-bottom: 1px solid #f5e5e5; display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 16px; font-weight: 700; }
    .modal-close { font-size: 22px; cursor: pointer; color: #ccc; background: none; border: none; }
    .modal-body { padding: 20px; }

    .checkin-item {
      background: #fdf5f5;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .checkin-date { font-size: 11px; color: #bbb; margin-bottom: 8px; font-weight: 700; }
    .checkin-scores { display: flex; gap: 16px; font-size: 13px; }
    .checkin-scores span { color: #aaa; }
    .checkin-scores strong { color: #e95f5f; }
    .checkin-note { font-size: 12px; color: #999; margin-top: 8px; line-height: 1.6; font-style: italic; }
    .checkin-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .checkin-tag { font-size: 11px; background: #fff0f3; color: #e95f5f; padding: 3px 9px; border-radius: 10px; }

    /* Notice form */
    .notice-form textarea, .notice-form input[type="text"] {
      width: 100%; border: 2px solid #f5e5e5; border-radius: 12px;
      padding: 12px 14px; font-size: 14px; font-family: inherit; color: #333;
      background: #fdf5f5; outline: none; transition: border-color .2s; margin-bottom: 10px;
    }
    .notice-form textarea:focus, .notice-form input:focus { border-color: #e95f5f; background: #fff; }
    .notice-form textarea { resize: none; line-height: 1.8; }
    .notice-submit {
      background: linear-gradient(135deg, #e95f5f, #d44a4a); color: #fff; border: none;
      border-radius: 12px; padding: 12px 28px; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: opacity .2s;
    }
    .notice-submit:hover { opacity: .88; }
    .notice-submit:disabled { opacity: .45; }
    .pin-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; color: #555; }
    .pin-toggle input { accent-color: #e95f5f; width: 16px; height: 16px; }

    .notice-list-item {
      background: #fdf5f5; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    }
    .notice-item-title { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 4px; }
    .notice-item-body { font-size: 12px; color: #777; line-height: 1.6; }
    .notice-item-meta { font-size: 11px; color: #bbb; margin-top: 4px; }
    .notice-delete {
      background: none; border: 1.5px solid #f5c0c0; color: #e95f5f;
      padding: 5px 12px; border-radius: 10px; font-size: 11px; font-family: inherit; cursor: pointer; flex-shrink: 0;
    }

    /* Question memos */
    .q-item {
      background: #fdf5f5; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    }
    .q-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .q-item-lecture { font-size: 11px; font-weight: 700; color: #e95f5f; }
    .q-item-name { font-size: 11px; color: #bbb; }
    .q-item-text { font-size: 13px; color: #444; line-height: 1.7; margin-bottom: 8px; }
    .q-answered { display: inline-block; background: #e8f5e9; color: #5cb87a; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 10px; }
    .q-answer-btn {
      background: #e95f5f; color: #fff; border: none; border-radius: 10px; padding: 5px 14px;
      font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer;
    }

    #no-access { text-align: center; padding: 80px 20px; }
    #no-access h2 { font-size: 20px; margin-bottom: 10px; color: #333; }
    #no-access p { color: #bbb; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
      <h1>管理画面</h1>
      <div class="admin-badge">ADMIN</div>
    </div>
  </div>

  <div id="no-access" style="display:none">
    <h2>アクセス権限がありません</h2>
    <p>この画面は管理者専用です</p>
  </div>

  <div class="content" id="admin-content" style="display:none">
    <div class="overview">
      <div class="ov-card"><div class="ov-value" id="total-members">0</div><div class="ov-label">総会員数</div></div>
      <div class="ov-card"><div class="ov-value" id="active-today">0</div><div class="ov-label">今日チェックイン</div></div>
      <div class="ov-card"><div class="ov-value" id="active-week">0</div><div class="ov-label">今週チェックイン</div></div>
      <div class="ov-card"><div class="ov-value" id="avg-score">-</div><div class="ov-label">今週平均スコア</div></div>
    </div>

    <div class="section">
      <div class="section-title">ゴール別会員数</div>
      <div class="goal-bars">
        <div class="goal-bar-row">
          <div class="goal-bar-label">💕 復縁したい</div>
          <div class="goal-bar-bg"><div class="goal-bar-fill" id="bar-reconnect" style="width:0%"></div></div>
          <div class="goal-bar-count" id="count-reconnect">0</div>
        </div>
        <div class="goal-bar-row">
          <div class="goal-bar-label">🌱 次の恋愛で成功</div>
          <div class="goal-bar-bg"><div class="goal-bar-fill" id="bar-next_love" style="width:0%;background:#5cb87a"></div></div>
          <div class="goal-bar-count" id="count-next_love">0</div>
        </div>
        <div class="goal-bar-row">
          <div class="goal-bar-label">🕊️ 納得できる終わり</div>
          <div class="goal-bar-bg"><div class="goal-bar-fill" id="bar-closure" style="width:0%;background:#7986cb"></div></div>
          <div class="goal-bar-count" id="count-closure">0</div>
        </div>
      </div>
    </div>

    <!-- 会員の記録を一括で見る -->
    <div class="section" id="member-feed-section">
      <div class="section-title">会員の記録を一括で見る</div>
      <p style="font-size:12px;color:#888;margin-bottom:14px;line-height:1.65">
        チェックイン（スライダー＋メモ）・<strong>日報</strong>（<code>daily_reports</code> の本文）・ワーク回答・講義メモ・復縁日記を、全会員分まとめて表示します。
      </p>
      <div class="feed-tabs" id="feed-tabs">
        <button type="button" class="feed-tab active" data-tab="checkin">チェックイン</button>
        <button type="button" class="feed-tab" data-tab="daily">日報（毎日）</button>
        <button type="button" class="feed-tab" data-tab="work">ワーク回答</button>
        <button type="button" class="feed-tab" data-tab="memo">講義メモ（全件）</button>
        <button type="button" class="feed-tab" data-tab="diary">復縁日記</button>
      </div>
      <div id="feed-hint-box"></div>
      <div class="feed-panel active" id="panel-checkin"></div>
      <div class="feed-panel" id="panel-daily"></div>
      <div class="feed-panel" id="panel-work"></div>
      <div class="feed-panel" id="panel-memo"></div>
      <div class="feed-panel" id="panel-diary"></div>
    </div>

    <!-- お知らせ投稿 -->
    <div class="section">
      <div class="section-title">ジローからのお知らせ</div>
      <div class="notice-form">
        <input type="text" id="notice-title-input" placeholder="タイトル（例：今週のポイント）">
        <textarea id="notice-body-input" rows="4" placeholder="内容を書いてください。メンバー全員のダッシュボードに表示されます。"></textarea>
        <div class="pin-toggle">
          <input type="checkbox" id="notice-pin"> <label for="notice-pin">ピン留めする（目立つ位置に表示）</label>
        </div>
        <button class="notice-submit" id="notice-submit-btn" onclick="postNotice()">投稿する</button>
      </div>
      <div style="margin-top:20px" id="notice-list"></div>
    </div>

    <!-- 質問メモ（未回答） -->
    <div class="section" id="qmemo-section" style="display:none">
      <div class="section-title">未回答の質問メモ <span id="qmemo-count" style="color:#e95f5f"></span></div>
      <div id="qmemo-list"></div>
    </div>

    <div class="section">
      <div class="section-title">会員一覧</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>名前</th>
              <th>ゴール</th>
              <th>登録日</th>
              <th>チェックイン</th>
              <th>日報</th>
              <th>最終記録</th>
              <th>平均</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="member-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <div class="modal-title" id="modal-title">チェックイン履歴</div>
        <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="lectures-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = window.supabase;
    const sb = createClient(
      'https://ejcajjtptbrcwmgzqhjz.supabase.co',
      'sb_publishable_LF8EU4bFZpegd6wZPXGynQ_j_nkEGdP'
    );

    const ADMIN_EMAIL = 'shoyaaaaaa1127@gmail.com';
    const GOAL_LABELS = { reconnect: '復縁したい', next_love: '次の恋愛', closure: '納得できる終わり' };
    const GOAL_CLASSES = { reconnect: 'goal-reconnect', next_love: 'goal-next_love', closure: 'goal-closure' };
    const LECTURE_LIST = typeof LECTURES !== 'undefined' && Array.isArray(LECTURES) ? LECTURES : [];

    function esc(s) {
      if (s == null || s === '') return '';
      const el = document.createElement('div');
      el.textContent = String(s);
      return el.innerHTML;
    }

    function escAttr(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function lectureTitle(id) {
      const lec = LECTURE_LIST.find(l => l.id === id);
      return lec ? lec.title : id;
    }

    function formatWorkAnswer(raw) {
      if (!raw) return '(空)';
      let j;
      try { j = JSON.parse(raw); } catch { return String(raw); }
      if (j.answers && Array.isArray(j.answers)) {
        return j.answers.map((a, i) => `【問${i + 1}】\n${a || '（未入力）'}`).join('\n\n');
      }
      if (j.scores && Array.isArray(j.scores)) {
        const t = j.total != null ? `合計: ${j.total}` : '';
        return `チェックリスト回答\n${j.scores.map((n, i) => `${i + 1}. ${n}点`).join(' / ')}\n${t}`;
      }
      if (j.checked && Array.isArray(j.checked)) {
        const note = j.note ? `\nメモ:\n${j.note}` : '';
        return `チェック数: ${j.count ?? ''}${note}`;
      }
      if (j.scene0 !== undefined || Object.keys(j).some(k => k.startsWith('scene'))) {
        return JSON.stringify(j, null, 2);
      }
      if (j.row0 !== undefined || Object.keys(j).some(k => k.startsWith('row'))) {
        return JSON.stringify(j, null, 2);
      }
      return JSON.stringify(j, null, 2);
    }

    function formatDailyReportRow(r) {
      const pairs = [
        ['良かったこと①', r.good1],
        ['良かったこと②', r.good2],
        ['良かったこと③', r.good3],
        ['自分を褒める', r.self_praise],
        ['今日の行動', r.action_toward],
        ['成長メモ', r.growth],
        ['自己肯定スコア（1〜10）', r.self_esteem_score],
        ['ポジティブスコア（1〜10）', r.positive_score],
        ['諦めそうになった瞬間', r.give_up_moment],
        ['弱み・改善したい点', r.weak_point],
      ];
      const lines = [];
      for (const [label, val] of pairs) {
        if (val != null && String(val).trim() !== '') lines.push(`${label}\n${String(val).trim()}`);
      }
      return lines.length ? lines.join('\n\n') : '（本文の入力がまだありません）';
    }

    function memberLabel(map, userId) {
      const p = map[userId];
      if (!p) return esc(userId);
      const name = (p.name || '').trim();
      const email = (p.email || '').trim();
      if (name && email) return esc(name) + ' <span style="color:#aaa">' + esc(email) + '</span>';
      if (email) return esc(email);
      return esc(userId);
    }

    function renderFeedHint(errors) {
      const parts = [];
      if (errors.work) parts.push('ワーク: <code>work_answers</code> の読み取り（管理者 RLS）を確認してください。');
      if (errors.memo) parts.push('講義メモ一覧: <code>question_memos</code> の読み取りを確認してください。');
      if (errors.diary) parts.push('復縁日記: <code>diary_entries</code> テーブルまたは RLS を確認してください。');
      if (errors.daily) parts.push('日報本文: <code>daily_reports</code> の全文取得に失敗しました。');
      const hint = document.getElementById('feed-hint-box');
      if (!parts.length) { hint.innerHTML = ''; return; }
      hint.innerHTML = '<div class="feed-hint">一部のデータが読み込めませんでした。<br>' + parts.join('<br>') + '</div>';
    }

    function bindFeedTabs() {
      document.getElementById('feed-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.feed-tab');
        if (!btn) return;
        const tab = btn.dataset.tab;
        document.querySelectorAll('.feed-tab').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.feed-panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + tab).classList.add('active');
      });
    }

    function renderMemberFeeds(profileMap, allCheckins, waRes, diRes, drRes, memosAllRes) {
      const feedErrors = {
        work: !!(waRes.error),
        memo: !!(memosAllRes.error),
        diary: !!(diRes.error),
        daily: !!(drRes.error),
      };
      renderFeedHint(feedErrors);

      const sortedCheckins = [...(allCheckins || [])].sort((a, b) => {
        const c = String(b.date).localeCompare(String(a.date));
        if (c !== 0) return c;
        const ea = (profileMap[a.user_id]?.email || '');
        const eb = (profileMap[b.user_id]?.email || '');
        return ea.localeCompare(eb);
      });

      const elCheckin = document.getElementById('panel-checkin');
      if (!sortedCheckins.length) {
        elCheckin.innerHTML = '<p class="no-data" style="padding:12px;text-align:center">チェックインの記録がありません</p>';
      } else {
        elCheckin.innerHTML = sortedCheckins.map(c => `
          <div class="feed-card">
            <div class="feed-meta">
              <span><strong>日付</strong> ${esc(c.date)}</span>
              <span><strong>会員</strong> ${memberLabel(profileMap, c.user_id)}</span>
              <span><strong>気分/行動/前向き</strong> ${esc(c.mood)} / ${esc(c.action)} / ${esc(c.state)}</span>
            </div>
            ${c.note ? `<div class="feed-body">${esc(c.note)}</div>` : '<div class="feed-body" style="color:#bbb">（メモなし）</div>'}
          </div>
        `).join('');
      }

      const elDaily = document.getElementById('panel-daily');
      if (drRes.error || !drRes.data || !drRes.data.length) {
        elDaily.innerHTML = drRes.error
          ? '<p class="no-data" style="padding:12px;text-align:center">日報（daily_reports）を取得できません。</p>'
          : '<p class="no-data" style="padding:12px;text-align:center">日報の記録がありません</p>';
      } else {
        const sortedDaily = [...drRes.data].sort((a, b) => {
          const c = String(b.date).localeCompare(String(a.date));
          if (c !== 0) return c;
          const ea = (profileMap[a.user_id]?.email || '');
          const eb = (profileMap[b.user_id]?.email || '');
          return ea.localeCompare(eb);
        });
        elDaily.innerHTML = sortedDaily.map(r => `
          <div class="feed-card">
            <div class="feed-meta">
              <span><strong>日付</strong> ${esc(r.date)}</span>
              <span><strong>会員</strong> ${memberLabel(profileMap, r.user_id)}</span>
              <span><strong>更新</strong> ${esc(r.updated_at || r.created_at || '')}</span>
            </div>
            <div class="feed-body">${esc(formatDailyReportRow(r))}</div>
          </div>
        `).join('');
      }

      const elWork = document.getElementById('panel-work');
      if (waRes.error || !waRes.data || !waRes.data.length) {
        elWork.innerHTML = waRes.error
          ? '<p class="no-data" style="padding:12px;text-align:center">ワーク回答を取得できません。</p>'
          : '<p class="no-data" style="padding:12px;text-align:center">ワーク回答の記録がありません</p>';
      } else {
        elWork.innerHTML = waRes.data.map(r => `
          <div class="feed-card">
            <div class="feed-title">${esc(lectureTitle(r.lecture_id))}</div>
            <div class="feed-meta">
              <span><strong>会員</strong> ${memberLabel(profileMap, r.user_id)}</span>
              <span><strong>講義ID</strong> ${esc(r.lecture_id)}</span>
              <span><strong>更新</strong> ${esc(r.updated_at || r.created_at || '')}</span>
            </div>
            <div class="feed-body">${esc(formatWorkAnswer(r.answer))}</div>
          </div>
        `).join('');
      }

      const elMemo = document.getElementById('panel-memo');
      if (memosAllRes.error || !memosAllRes.data || !memosAllRes.data.length) {
        elMemo.innerHTML = memosAllRes.error
          ? '<p class="no-data" style="padding:12px;text-align:center">講義メモ一覧を取得できません。</p>'
          : '<p class="no-data" style="padding:12px;text-align:center">講義メモはまだありません</p>';
      } else {
        elMemo.innerHTML = memosAllRes.data.map(m => `
          <div class="feed-card">
            <div class="feed-title">${esc(lectureTitle(m.lecture_id))}${m.is_answered ? ' <span style="color:#5cb87a;font-size:11px">（回答済）</span>' : ''}</div>
            <div class="feed-meta">
              <span><strong>会員</strong> ${memberLabel(profileMap, m.user_id)}</span>
              <span><strong>日時</strong> ${esc(m.created_at)}</span>
            </div>
            <div class="feed-body">${esc(m.question)}</div>
          </div>
        `).join('');
      }

      const elDiary = document.getElementById('panel-diary');
      if (diRes.error || !diRes.data || !diRes.data.length) {
        elDiary.innerHTML = diRes.error
          ? '<p class="no-data" style="padding:12px;text-align:center">復縁日記を取得できません。</p>'
          : '<p class="no-data" style="padding:12px;text-align:center">復縁日記の記録がありません</p>';
      } else {
        elDiary.innerHTML = diRes.data.map(d => `
          <div class="feed-card">
            <div class="feed-meta">
              <span><strong>日付</strong> ${esc(d.date)}</span>
              <span><strong>会員</strong> ${memberLabel(profileMap, d.user_id)}</span>
              <span><strong>更新</strong> ${esc(d.updated_at || d.created_at || '')}</span>
            </div>
            <div class="feed-body">${esc(d.content)}</div>
          </div>
        `).join('');
      }
    }

    function getDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function closeModal(e) {
      if (!e || e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
    }

    async function postNotice() {
      const title = document.getElementById('notice-title-input').value.trim();
      const body = document.getElementById('notice-body-input').value.trim();
      if (!title || !body) { alert('タイトルと内容を入力してください'); return; }

      const btn = document.getElementById('notice-submit-btn');
      btn.disabled = true; btn.textContent = '投稿中...';

      const { error } = await sb.from('notices').insert({
        title, body, is_pinned: document.getElementById('notice-pin').checked
      });
      if (error) { alert('投稿に失敗しました'); btn.disabled = false; btn.textContent = '投稿する'; return; }

      document.getElementById('notice-title-input').value = '';
      document.getElementById('notice-body-input').value = '';
      document.getElementById('notice-pin').checked = false;
      btn.disabled = false; btn.textContent = '投稿する';
      loadNotices();
    }

    async function deleteNotice(id) {
      if (!confirm('このお知らせを削除しますか？')) return;
      await sb.from('notices').delete().eq('id', id);
      loadNotices();
    }

    async function loadNotices() {
      const { data } = await sb.from('notices').select('*').order('created_at', { ascending: false });
      const list = document.getElementById('notice-list');
      if (!data || data.length === 0) {
        list.innerHTML = '<div style="font-size:13px;color:#bbb;text-align:center;padding:12px">投稿済みのお知らせはありません</div>';
        return;
      }
      list.innerHTML = data.map(n => `
        <div class="notice-list-item">
          <div style="flex:1">
            <div class="notice-item-title">${n.is_pinned ? '📌 ' : ''}${esc(n.title)}</div>
            <div class="notice-item-body">${esc(n.body)}</div>
            <div class="notice-item-meta">${esc(n.created_at.slice(0,10))}</div>
          </div>
          <button class="notice-delete" onclick="deleteNotice('${escAttr(n.id)}')">削除</button>
        </div>`).join('');
    }

    async function markAnswered(memoId) {
      await sb.from('question_memos').update({ is_answered: true }).eq('id', memoId);
      loadQuestionMemos(allProfileMap);
    }

    let allProfileMap = {};
    async function loadQuestionMemos(profileMap) {
      allProfileMap = profileMap;
      const { data: memos } = await sb.from('question_memos').select('*').eq('is_answered', false).order('created_at', { ascending: false });
      const section = document.getElementById('qmemo-section');
      if (!memos || memos.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      document.getElementById('qmemo-count').textContent = `（${memos.length}件）`;
      document.getElementById('qmemo-list').innerHTML = memos.map(m => {
        const memberName = esc(profileMap[m.user_id]?.name || '不明');
        return `<div class="q-item">
          <div class="q-item-header">
            <div class="q-item-lecture">講義 ${esc(m.lecture_id)}</div>
            <div class="q-item-name">${memberName}</div>
          </div>
          <div class="q-item-text">${esc(m.question)}</div>
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-size:11px;color:#bbb">${esc(m.created_at.slice(0,10))}</div>
            <button class="q-answer-btn" onclick="markAnswered('${escAttr(m.id)}')">回答済みにする</button>
          </div>
        </div>`;
      }).join('');
    }

    async function showMemberDetail(userId, name) {
      document.getElementById('modal-title').textContent = `${name} のチェックイン履歴`;
      document.getElementById('modal-body').innerHTML = '<p style="color:#bbb;text-align:center;padding:20px">読み込み中...</p>';
      document.getElementById('modal').classList.add('open');

      const { data: checkins } = await sb.from('checkins')
        .select('*').eq('user_id', userId).order('date', { ascending: false }).limit(30);

      if (!checkins || checkins.length === 0) {
        document.getElementById('modal-body').innerHTML = '<p style="color:#bbb;text-align:center;padding:20px">チェックインデータがありません</p>';
        return;
      }

      document.getElementById('modal-body').innerHTML = checkins.map(c => `
        <div class="checkin-item">
          <div class="checkin-date">${esc(c.date)}</div>
          <div class="checkin-scores">
            <span>気分 <strong>${esc(c.mood)}</strong></span>
            <span>行動 <strong>${esc(c.action)}</strong></span>
            <span>前向き <strong>${esc(c.state)}</strong></span>
            <span style="color:#e95f5f">平均 <strong>${((Number(c.mood)+Number(c.action)+Number(c.state))/3).toFixed(1)}</strong></span>
          </div>
          ${c.tags && c.tags.length ? `<div class="checkin-tags">${c.tags.map(t => `<span class="checkin-tag">${esc(t)}</span>`).join('')}</div>` : ''}
          ${c.note ? `<div class="checkin-note">${esc(c.note)}</div>` : ''}
        </div>
      `).join('');
    }

    (async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user || user.email !== ADMIN_EMAIL) {
        document.getElementById('no-access').style.display = 'block';
        return;
      }

      document.getElementById('admin-content').style.display = 'block';
      bindFeedTabs();
      loadNotices();

      const [profilesRes, checkinsRes, waRes, diRes, drFullRes, memosAllRes] = await Promise.all([
        sb.from('profiles').select('*').order('created_at', { ascending: false }),
        sb.from('checkins').select('*').order('date', { ascending: false }).limit(2000),
        sb.from('work_answers').select('*').order('updated_at', { ascending: false }).limit(500),
        sb.from('diary_entries').select('*').order('date', { ascending: false }).limit(300),
        sb.from('daily_reports').select('*').order('date', { ascending: false }).limit(800),
        sb.from('question_memos').select('*').order('created_at', { ascending: false }).limit(400),
      ]);

      const profiles = profilesRes.data || [];
      const profileMap = {};
      profiles.forEach(p => { profileMap[p.id] = p; });
      loadQuestionMemos(profileMap);
      const allCheckins = checkinsRes.data || [];
      const allReports = drFullRes.data || [];

      renderMemberFeeds(profileMap, allCheckins, waRes, diRes, drFullRes, memosAllRes);

      const total = profiles.length;
      document.getElementById('total-members').textContent = total;

      const today = new Date();
      const todayStr = getDateStr(today);
      const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 6);
      const weekAgoStr = getDateStr(weekAgo);

      const todayActive = new Set(allCheckins.filter(c => c.date === todayStr).map(c => c.user_id)).size;
      const weekActive = new Set(allCheckins.filter(c => c.date >= weekAgoStr).map(c => c.user_id)).size;
      document.getElementById('active-today').textContent = todayActive;
      document.getElementById('active-week').textContent = weekActive;

      const weekCheckins = allCheckins.filter(c => c.date >= weekAgoStr);
      if (weekCheckins.length > 0) {
        const avg = weekCheckins.reduce((s, c) => s + (c.mood + c.action + c.state) / 3, 0) / weekCheckins.length;
        document.getElementById('avg-score').textContent = avg.toFixed(1);
      }

      // Goal distribution
      const goalCounts = { reconnect: 0, next_love: 0, closure: 0 };
      profiles.forEach(p => { if (p.goal) goalCounts[p.goal]++; });
      const maxGoal = Math.max(...Object.values(goalCounts), 1);
      Object.entries(goalCounts).forEach(([goal, count]) => {
        document.getElementById('count-' + goal).textContent = count;
        document.getElementById('bar-' + goal).style.width = (count / maxGoal * 100) + '%';
      });

      // Member table
      const tbody = document.getElementById('member-table');
      tbody.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-detail]');
        if (!btn) return;
        showMemberDetail(btn.dataset.userId, btn.dataset.userName || '名前なし');
      });

      if (profiles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="no-data" style="padding:20px;text-align:center">会員がいません</td></tr>';
        return;
      }

      // Report counts per user（日報件数＝ daily_reports の行数）
      const reportCounts = {};
      allReports.forEach(r => { reportCounts[r.user_id] = (reportCounts[r.user_id] || 0) + 1; });

      tbody.innerHTML = profiles.map(p => {
        const memberCheckins = allCheckins.filter(c => c.user_id === p.id);
        const checkinCount = memberCheckins.length;
        const lastCheckin = [...memberCheckins].sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];
        const avgScore = checkinCount > 0
          ? (memberCheckins.reduce((s, c) => s + (Number(c.mood) + Number(c.action) + Number(c.state)) / 3, 0) / checkinCount).toFixed(1)
          : '-';
        const regDate = new Date(p.created_at).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' });
        const reportCount = reportCounts[p.id] || 0;
        const dispName = (p.name || '名前なし').trim();

        return `
          <tr>
            <td>${p.name ? esc(p.name) : '<span class="no-data">未設定</span>'}</td>
            <td>${p.goal ? `<span class="goal-tag ${GOAL_CLASSES[p.goal]}">${esc(GOAL_LABELS[p.goal])}</span>` : '<span class="no-data">未設定</span>'}</td>
            <td style="color:#aaa">${esc(regDate)}</td>
            <td style="font-weight:700;color:#e95f5f">${checkinCount}回</td>
            <td style="font-weight:700;color:#5cb87a">${reportCount}回</td>
            <td style="color:#aaa">${lastCheckin ? esc(lastCheckin.date) : '<span class="no-data">なし</span>'}</td>
            <td style="font-weight:700;color:#e95f5f">${esc(avgScore)}</td>
            <td><button type="button" class="detail-btn" data-detail data-user-id="${escAttr(p.id)}" data-user-name="${escAttr(dispName)}">詳細</button></td>
          </tr>
        `;
      }).join('');
    })();
  </script>
</body>
</html>
