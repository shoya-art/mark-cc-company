<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お名前の登録 | リリー</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; background: #fdf5f5; color: #333; font-family: 'Zen Maru Gothic', sans-serif; }
    .card { width: 100%; max-width: 460px; background: #fff; border-radius: 20px; padding: 34px 26px; }
    h1 { margin: 0 0 12px; font-size: 22px; text-align: center; }
    p { margin: 0 0 26px; color: #777; font-size: 14px; line-height: 1.8; text-align: center; }
    label { display: block; margin: 18px 0 7px; font-size: 13px; font-weight: 700; }
    input { width: 100%; padding: 15px 18px; border: 2px solid #f0d0d0; border-radius: 14px; font: inherit; font-size: 16px; outline: none; }
    input:focus { border-color: #e95f5f; }
    .hint { margin-top: 5px; color: #999; font-size: 12px; }
    button { width: 100%; margin-top: 28px; padding: 17px; border: 0; border-radius: 14px; background: #e95f5f; color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #message { min-height: 20px; margin-top: 12px; color: #bd4242; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>お名前を教えてください</h1>
    <p>会員サイトをより使いやすくするため、<br>表示するお名前と管理用のお名前を登録してください。</p>
    <form id="profile-form">
      <label for="nickname">サイトに表示するニックネーム</label>
      <input id="nickname" name="nickname" type="text" maxlength="20" autocomplete="nickname" required placeholder="例：りん">
      <div class="hint">サイト内のあいさつなどに表示されます。</div>
      <label for="full-name">本名</label>
      <input id="full-name" name="full-name" type="text" maxlength="80" autocomplete="name" required placeholder="例：山田 花子">
      <div class="hint">ジローが会員情報を確認するために使います。</div>
      <button id="save-btn" type="submit">登録して講座へ進む</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const { createClient } = window.supabase;
    const sb = createClient('https://ejcajjtptbrcwmgzqhjz.supabase.co', 'sb_publishable_LF8EU4bFZpegd6wZPXGynQ_j_nkEGdP');
    let memberId = null;
    const form = document.getElementById('profile-form');
    const message = document.getElementById('message');
    const button = document.getElementById('save-btn');

    (async () => {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { window.location.replace('index.html'); return; }
      if (user.email !== '129@lily-member.app') { window.location.replace('dashboard.html'); return; }
      memberId = user.id;
      const { data: profile, error } = await sb.from('profiles').select('full_name').eq('id', memberId).single();
      if (error || !profile) { message.textContent = '会員情報を読み込めませんでした。再度ログインしてください。'; return; }
      if (profile.full_name) window.location.replace('dashboard.html');
    })();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!memberId || button.disabled) return;
      const nickname = document.getElementById('nickname').value.trim();
      const fullName = document.getElementById('full-name').value.trim();
      if (!nickname || !fullName) { message.textContent = 'ニックネームと本名を入力してください。'; return; }
      button.disabled = true;
      message.textContent = '';
      const { data: { user } } = await sb.auth.getUser();
      if (!user || user.id !== memberId || user.email !== '129@lily-member.app') {
        window.location.replace('index.html');
        return;
      }
      const { data, error } = await sb.from('profiles')
        .update({ name: nickname, full_name: fullName })
        .eq('id', memberId).is('full_name', null).select('id').single();
      if (error || !data) {
        message.textContent = '保存できませんでした。少し時間をおいて、もう一度お試しください。';
        button.disabled = false;
        return;
      }
      window.location.replace('dashboard.html');
    });
  </script>
</body>
</html>
