name: Threads v2 offline checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['threads-v2/**', '.github/workflows/threads-v2-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test && npm run check
        working-directory: threads-v2
