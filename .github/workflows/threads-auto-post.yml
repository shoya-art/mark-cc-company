name: Threads自動投稿

on:
  schedule:
    - cron: '0 22 * * 0-4'   # 新チェーン: 月〜金 7:00 JST
    - cron: '50 22 * * 0-4'  # 月〜金 7:50 JST (= 日〜木 22:50 UTC)
    - cron: '0 3 * * 1-5'    # 新チェーン: 月〜金 12:00 JST
    - cron: '20 3 * * 1-5'   # 月〜金 12:20 JST
    - cron: '0 12 * * 1-5'   # 新チェーン: 月〜金 21:00 JST
    - cron: '30 12 * * 1-5'  # 月〜金 21:30 JST
  workflow_dispatch:
    inputs:
      post_mode:
        description: '投稿方式'
        required: true
        default: 'legacy'
        type: choice
        options:
          - legacy
          - chain
      time_slot:
        description: '投稿時間帯'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - lunch
          - evening

permissions:
  contents: read

concurrency:
  group: threads-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Determine posting mode and time slot
        id: posting
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.post_mode }}" >> $GITHUB_OUTPUT
            echo "slot=${{ github.event.inputs.time_slot }}" >> $GITHUB_OUTPUT
          else
            # Scheduled jobs can start more than an hour late. Determine the slot
            # from the cron expression that triggered the run, not the start time.
            case "${{ github.event.schedule }}" in
              '0 22 * * 0-4')
                echo "mode=chain" >> $GITHUB_OUTPUT
                echo "slot=morning" >> $GITHUB_OUTPUT
                ;;
              '50 22 * * 0-4')
                echo "mode=legacy" >> $GITHUB_OUTPUT
                echo "slot=morning" >> $GITHUB_OUTPUT
                ;;
              '0 3 * * 1-5')
                echo "mode=chain" >> $GITHUB_OUTPUT
                echo "slot=lunch" >> $GITHUB_OUTPUT
                ;;
              '20 3 * * 1-5')
                echo "mode=legacy" >> $GITHUB_OUTPUT
                echo "slot=lunch" >> $GITHUB_OUTPUT
                ;;
              '0 12 * * 1-5')
                echo "mode=chain" >> $GITHUB_OUTPUT
                echo "slot=evening" >> $GITHUB_OUTPUT
                ;;
              '30 12 * * 1-5')
                echo "mode=legacy" >> $GITHUB_OUTPUT
                echo "slot=evening" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "::error title=Unknown schedule::${{ github.event.schedule }}"
                exit 1
                ;;
            esac
          fi

      - name: Post to Threads
        run: python scripts/threads_post.py ${{ steps.posting.outputs.mode }} ${{ steps.posting.outputs.slot }} .
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_SUPABASE_URL: ${{ secrets.THREADS_SUPABASE_URL }}
          THREADS_SUPABASE_SECRET_KEY: ${{ secrets.THREADS_SUPABASE_SECRET_KEY }}
